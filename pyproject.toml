[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dol-schema"
version = "2026.10.4"
description = "Definisi skema data Delivery Ops Layer (PT Bhakti Unggul Teknovasi)"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["dol_schema"]

[tool.ruff]
# Sama dengan dol-parser: PEP 8, batas baris 100. `ruff check` & `ruff format --check` di CI.
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["dol_schema"]
